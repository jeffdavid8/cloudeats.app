server {
    listen 80;
    server_name mediabrain.app.local mediabrain.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mediabrain.app.local mediabrain.app;

    ssl_certificate /etc/nginx/certs/local.crt;
    ssl_certificate_key /etc/nginx/certs/local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/mediabrain.app.access.log;
    error_log /var/log/nginx/mediabrain.app.error.log;

    # Proxy all requests to the MediaBrain Docker container
    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Handle static files with proper MIME types
        proxy_set_header Accept-Encoding '';
    }
}