<?xml version="1.0" encoding="utf-8"?>
<svg class="nav-trigger-favicon" viewBox="0 0 100 100" xmlns="http://w3.org">
  <style>
    /* Base Vector Rules */
    .fav-bg {
      transition: fill 0.3s ease;
    }
    .fav-letters {
      fill: none;
      stroke-width: 14;          /* Super thick for 16x16 tab rendering */
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s ease;
    }

    /* System Light/Day Mode */
    @media (prefers-color-scheme: light) {
      .fav-bg { fill: #1A73E8; }
      .fav-letters { stroke: #FFFFFF; }
    }

    /* System Dark/Night Mode */
    @media (prefers-color-scheme: dark) {
      .fav-bg { fill: #303134; }
      .fav-letters { stroke: #8AB4F8; }
    }
  </style>

  <!-- Solid backing circle for high contrast against browser tabs -->
  <circle cx="50" cy="50" r="46" class="fav-bg" />
  
  <!-- Your perfect unified 'C' and 'E' path geometry -->
  <path d="M 72,26 H 44 A 24,24 0 0,0 44,74 H 72 M 44,50 H 66" class="fav-letters" />
</svg>
