server {
    listen 80;
    server_name mediabrain.app.local mediabrain.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mediabrain.app.local mediabrain.app;

    root /var/www/mediabrain.app.local/html;
    index index.php index.html index.htm;

    ssl_certificate /etc/nginx/certs/local.crt;
    ssl_certificate_key /etc/nginx/certs/local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/mediabrain.app.access.log;
    error_log /var/log/nginx/mediabrain.app.error.log;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass mediabrain-app:9000;
    }

    # Handle static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}