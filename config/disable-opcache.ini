; Disable OPcache completely for development
; This prevents inclusion issues and cache corruption
opcache.enable = Off
opcache.enable_cli = Off

; Alternative: If you want to keep opcache but make it very conservative
; opcache.enable = On
; opcache.validate_timestamps = On
; opcache.revalidate_freq = 0
; opcache.file_update_protection = 0
; opcache.max_accelerated_files = 1000
; opcache.memory_consumption = 64