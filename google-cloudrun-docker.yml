jobs:
  build-and-deploy:
    steps:
      - name: Build Docker Image
        run: |
          gcloud builds submit --tag gcr.io/${{ env._AR_PROJECT_ID }}/${{ env._SERVICE_NAME }}:${{ github.sha }} --target=production_build
          echo "Successfully built image tagged: gcr.io/${{ env._AR_PROJECT_ID }}/${{ env._SERVICE_NAME }}:${{ github.sha }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env._SERVICE_NAME }} \
            --image gcr.io/${{ env._AR_PROJECT_ID }}/${{ env._SERVICE_NAME }}:${{ github.sha }} \
            --region=${{ env._DEPLOY_REGION }} \
            --platform=managed
          echo "Successfully deployed image: gcr.io/${{ env._AR_PROJECT_ID }}/${{ env._SERVICE_NAME }}:${{ github.sha }}"